name: Release

# On-demand: Actions > Release > Run workflow. Builds signed x64 and ARM64 MSIX packages with the official
# OAuth client ID baked in and publishes them to a GitHub release tagged v<version>.
#
# Repository variables: GITHUBTODO_CLIENT_ID, MSIX_PUBLISHER (must exactly match the signing certificate subject),
#   MSIX_PUBLISHER_DISPLAY_NAME, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
# Repository secrets:   AZURE_TENANT_ID, AZURE_CLIENT_ID (OIDC: the app registration needs a
#   federated credential for repo:dotMorten/GitHubToDo:ref:refs/heads/main and the Artifact Signing Certificate
#   Profile Signer role on the certificate profile)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (major.minor.build, e.g. 1.0.0)
        required: true
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      GITHUBTODO_CLIENT_ID: ${{ vars.GITHUBTODO_CLIENT_ID }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - name: Validate inputs and configuration
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          if ($env:VERSION -notmatch '^\d{1,5}\.\d{1,5}\.\d{1,5}$') { throw "Version must be major.minor.build (e.g. 1.0.0), got '$env:VERSION'." }
          foreach ($name in 'GITHUBTODO_CLIENT_ID','MSIX_PUBLISHER','AZURE_SIGNING_ENDPOINT','AZURE_SIGNING_ACCOUNT','AZURE_SIGNING_PROFILE') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Repository variable $name is not set." }
          }
          gh release view "v$env:VERSION" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v$env:VERSION already exists." }
          exit 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The checked-in NuGet.Config points at a private mirror; CI restores from nuget.org.
      - name: Use nuget.org
        shell: pwsh
        run: |
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          '@ | Set-Content NuGet.Config -Encoding utf8

      - name: Stamp package identity
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $path = Resolve-Path 'src/GitHubToDo/Package.appxmanifest'
          [xml]$manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Version = "$env:VERSION.0"
          $manifest.Package.Identity.Publisher = $env:MSIX_PUBLISHER
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $manifest.Package.Properties.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          $manifest.Save($path)
          Write-Host "Identity: $($manifest.Package.Identity.Name) $($manifest.Package.Identity.Version) $($manifest.Package.Identity.Publisher)"

      - name: Run core tests
        run: dotnet test tests/GitHubToDo.Core.Tests -c Release

      - name: Build MSIX packages
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force "$out\release" | Out-Null
          foreach ($arch in 'x64','arm64') {
            $platform = if ($arch -eq 'arm64') { 'ARM64' } else { 'x64' }
            dotnet publish src/GitHubToDo/GitHubToDo.csproj -c Release -r "win-$arch" "-p:Platform=$platform" `
              -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Never `
              "-p:AppxPackageDir=$out\pkg\$arch\" -tl:off
            if ($LASTEXITCODE -ne 0) { throw "Packaging $arch failed." }
            $msix = Get-ChildItem "$out\pkg\$arch" -Recurse -Filter '*.msix' | Select-Object -First 1
            if (-not $msix) { throw "No $arch MSIX produced." }
            Copy-Item $msix.FullName "$out\release\GitHubToDo_$($env:VERSION)_$arch.msix"
          }
          Get-ChildItem "$out\release" | Format-Table Name, Length

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # Signing only needs the certificate-profile role, not subscription access.
          allow-no-subscriptions: true

      - name: Sign MSIX packages
        uses: azure/artifact-signing-action@v2
        with:
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-azure-cli-credential: false
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\release
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem artifacts/release -Filter *.msix) {
            $sig = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if (-not $sig.SignerCertificate) { throw "$($file.Name) is not signed." }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: GitHubToDo-${{ inputs.version }}
          path: artifacts/release/*.msix
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $files = (Get-ChildItem artifacts/release -Filter *.msix).FullName
          $flags = @('--target', $env:GITHUB_SHA, '--title', "GitHubToDo $env:VERSION", '--generate-notes', '--repo', $env:GITHUB_REPOSITORY)
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release create "v$env:VERSION" @files @flags
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
